name: "R2 Image Optimizer — WebP 50%"

# Downloads images from R2 for the last 2 partitions (2026-08-17 & 2026-08-18),
# converts them to WebP at 50% quality, and uploads to:
#   {website}/.../year=YYYY/month=MM/day=DD/optimized/{stem}.webp
# Original images are kept untouched.
# A summary table is printed showing total sizes per website per day.

on:
  workflow_dispatch:
    inputs:
      skip_existing:
        description: "Skip images that already have an optimized version in R2"
        required: true
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

concurrency:
  group: optimize-images
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

jobs:
  optimize:
    name: Convert images to WebP 50%
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
      CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r CFl_data/requirements.txt

      - name: Sync system clock (prevent R2 RequestTimeTooSkewed)
        run: |
          echo "UTC before sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo timedatectl set-ntp true
          sudo systemctl restart systemd-timesyncd 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrony
          sudo chronyd -q 'pool pool.ntp.org iburst' || sudo chronyc -a makestep
          echo "UTC after sync:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run image optimizer
        env:
          SKIP_EXISTING: ${{ github.event.inputs.skip_existing }}
        run: |
          echo "============================================="
          echo "Bucket       : $CF_R2_BUCKET_NAME"
          echo "Dates        : 2026-08-17 & 2026-08-18"
          echo "Format       : WebP at 50% quality"
          echo "Skip existing: $SKIP_EXISTING"
          echo "Original keys: preserved (no deletion)"
          echo "New path      : .../{date}/optimized/{stem}.webp"
          echo "============================================="

          EXTRA_ARGS=()
          if [ "$SKIP_EXISTING" = "no" ]; then
            EXTRA_ARGS+=(--no-skip-existing)
          fi

          python CFl_data/r2-analysis/optimize_images.py \
            --bucket "$CF_R2_BUCKET_NAME" \
            "${EXTRA_ARGS[@]}"
